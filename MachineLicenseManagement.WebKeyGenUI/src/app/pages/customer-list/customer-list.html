<h2>Kundenliste</h2>
<dvs-button routerLink="/customers/new" class="create-btn">
  + Neuer Kunde
</dvs-button>
<div *ngIf="isLoading" class="loading">
  Lädt Kunden...
</div>

  <dvs-datatable *ngIf="!isLoading" [totalSize]="customers.length" [pageSize]="10"
label-items-per-page="Pro Seite"
label-page-from="von">
    <dvs-datatable-header-row>
      <dvs-datatable-header-cell>ID</dvs-datatable-header-cell>
      <dvs-datatable-header-cell>Name</dvs-datatable-header-cell>
      <dvs-datatable-header-cell>Adresse</dvs-datatable-header-cell>
      <dvs-datatable-header-cell>PLZ</dvs-datatable-header-cell>
      <dvs-datatable-header-cell>Stadt</dvs-datatable-header-cell>
      <dvs-datatable-header-cell>Land</dvs-datatable-header-cell>
      <dvs-datatable-header-cell>Kommentar</dvs-datatable-header-cell>
      <dvs-datatable-header-cell>Aktionen</dvs-datatable-header-cell>
    </dvs-datatable-header-row>

    <dvs-datatable-row *ngFor="let customer of customers">
      <dvs-datatable-cell>{{ customer.id }}</dvs-datatable-cell>
      <dvs-datatable-cell>{{ customer.name }}</dvs-datatable-cell>
      <dvs-datatable-cell>{{ customer.address }}</dvs-datatable-cell>
      <dvs-datatable-cell>{{ customer.zip }}</dvs-datatable-cell>
      <dvs-datatable-cell>{{ customer.city }}</dvs-datatable-cell>
      <dvs-datatable-cell>{{ customer.country }}</dvs-datatable-cell>
      <dvs-datatable-cell>{{ customer.comment }}</dvs-datatable-cell>
      <dvs-datatable-cell>
        <dvs-button (click)="editCustomer(customer.id)" variant="secondary" size="small" style="margin-right: 8px;">
          Bearbeiten
        </dvs-button>
        <dvs-button (click)="deleteCustomer(customer.id)" variant="danger" size="small">
          Löschen
        </dvs-button>
      </dvs-datatable-cell>
    </dvs-datatable-row>
  </dvs-datatable>
